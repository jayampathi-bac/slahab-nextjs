<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80" fill="none">
  <!-- Diamond star emblem -->
  <g transform="translate(110,18)" fill="white">
    <polygon points="0,-13 3,-3 13,0 3,3 0,13 -3,3 -13,0 -3,-3" opacity="0.9"/>
    <polygon points="0,-8 2,-2 8,0 2,2 0,8 -2,2 -8,0 -2,-2" fill="#0a0a0a"/>
    <circle cx="0" cy="0" r="2.5"/>
    <!-- Corner diamonds -->
    <polygon points="-18,-18 -16,-18 -18,-16" opacity="0.5"/>
    <polygon points="18,-18 16,-18 18,-16" opacity="0.5"/>
    <polygon points="-18,18 -16,18 -18,16" opacity="0.5"/>
    <polygon points="18,18 16,18 18,16" opacity="0.5"/>
  </g>
  <!-- intercoiffure -->
  <text x="110" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="white" text-anchor="middle" letter-spacing="3" font-style="italic">intercoiffure</text>
  <!-- MONDIAL -->
  <text x="110" y="64" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="white" text-anchor="middle" letter-spacing="5" font-weight="300" opacity="0.75">MONDIAL</text>
  <!-- SRI LANKA -->
  <text x="110" y="74" font-family="Arial, Helvetica, sans-serif" font-size="6" fill="white" text-anchor="middle" letter-spacing="3.5" opacity="0.55">SRI LANKA</text>
</svg>
