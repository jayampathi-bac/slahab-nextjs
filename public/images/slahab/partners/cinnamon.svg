<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80" fill="none">
  <!-- Stylised cinnamon scroll / leaf mark -->
  <g transform="translate(110,18)" stroke="white" fill="none">
    <!-- Outer scroll -->
    <path d="M0,-14 C6,-14 12,-8 12,0 C12,8 6,12 0,12 C-5,12 -10,8 -11,3" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Inner curl -->
    <path d="M0,-8 C3,-8 7,-5 7,0 C7,5 3,7 0,7 C-2.5,7 -5,5 -6,2" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Centre dot -->
    <circle cx="0" cy="0" r="2" fill="white" stroke="none"/>
    <!-- Two decorative lines flanking -->
    <line x1="-18" y1="0" x2="-15" y2="0" stroke-width="1" opacity="0.5"/>
    <line x1="15" y1="0" x2="18" y2="0" stroke-width="1" opacity="0.5"/>
  </g>
  <!-- CINNAMON -->
  <text x="110" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="white" text-anchor="middle" letter-spacing="5">CINNAMON</text>
  <!-- HOTELS & RESORTS -->
  <text x="110" y="63" font-family="Arial, Helvetica, sans-serif" font-size="6.5" fill="white" text-anchor="middle" letter-spacing="3" font-weight="300" opacity="0.7">HOTELS &amp; RESORTS</text>
</svg>
