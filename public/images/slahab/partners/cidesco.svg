<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80" fill="none">
  <!-- Circular emblem -->
  <g transform="translate(110,18)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="14" stroke="white" stroke-width="1.2" opacity="0.8"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="10" stroke="white" stroke-width="0.6" opacity="0.4"/>
    <!-- Cross / compass points -->
    <line x1="0" y1="-14" x2="0" y2="-10" stroke="white" stroke-width="1.2"/>
    <line x1="0" y1="10" x2="0" y2="14" stroke="white" stroke-width="1.2"/>
    <line x1="-14" y1="0" x2="-10" y2="0" stroke="white" stroke-width="1.2"/>
    <line x1="10" y1="0" x2="14" y2="0" stroke="white" stroke-width="1.2"/>
    <!-- Centre star -->
    <polygon points="0,-6 1.5,-1.5 6,0 1.5,1.5 0,6 -1.5,1.5 -6,0 -1.5,-1.5" fill="white" opacity="0.9"/>
  </g>
  <!-- CIDESCO -->
  <text x="110" y="50" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle" letter-spacing="5">CIDESCO</text>
  <!-- INTERNATIONAL -->
  <text x="110" y="63" font-family="Arial, Helvetica, sans-serif" font-size="6.5" fill="white" text-anchor="middle" letter-spacing="3" font-weight="300" opacity="0.7">INTERNATIONAL</text>
</svg>
