<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 80" width="220" height="80" fill="none">
  <!-- Wing / bird in flight -->
  <g transform="translate(110,18)" fill="white">
    <!-- Left wing -->
    <path d="M-2,0 C-6,-6 -14,-10 -20,-8 C-14,-4 -8,-1 -2,0 Z" opacity="0.9"/>
    <path d="M-2,1 C-7,-2 -16,-2 -22,2 C-15,3 -8,2 -2,1 Z" opacity="0.65"/>
    <!-- Right wing -->
    <path d="M2,0 C6,-6 14,-10 20,-8 C14,-4 8,-1 2,0 Z" opacity="0.9"/>
    <path d="M2,1 C7,-2 16,-2 22,2 C15,3 8,2 2,1 Z" opacity="0.65"/>
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="3" ry="5" transform="rotate(-5)"/>
    <!-- Tail -->
    <path d="M-1,4 L0,10 L1,4 Z" opacity="0.8"/>
  </g>
  <!-- Jetwing -->
  <text x="110" y="51" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="white" text-anchor="middle" letter-spacing="2" font-style="italic">Jetwing</text>
  <!-- TRAVELS -->
  <text x="110" y="64" font-family="Arial, Helvetica, sans-serif" font-size="7" fill="white" text-anchor="middle" letter-spacing="5" font-weight="300" opacity="0.7">TRAVELS</text>
</svg>
